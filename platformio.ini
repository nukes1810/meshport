; meshport: secure LoRa messaging firmware for the LILYGO T-Deck.
; Build the radio test: pio run -e radio_test
[env:radio_test]
platform = platformio/espressif32@6.11.0
framework = arduino
board = t-deck
monitor_speed = 115200
build_src_filter = +<meshport/radio_test/*>
lib_deps =
  jgromes/RadioLib @ ^7.6.0
build_flags =
  -D MESHPORT_RADIO_ENABLED
  -D MESHPORT_RADIO_TEST

[env:meshport_chat]
platform = platformio/espressif32@6.11.0
framework = arduino
board = t-deck
monitor_speed = 115200
build_src_filter = +<meshport/chat_test/*>
lib_deps =
  jgromes/RadioLib @ ^7.6.0
build_flags =
  -D MESHPORT_RADIO_ENABLED
  -D MESHPORT_CHAT_TEST
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

[env:meshport_chat_heltec]
platform = platformio/espressif32@6.11.0
framework = arduino
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
build_src_filter = +<meshport/chat_test/*>
lib_deps =
  jgromes/RadioLib @ ^7.6.0
build_flags =
  -D MESHPORT_RADIO_ENABLED
  -D MESHPORT_CHAT_TEST
  -D MESHPORT_BOARD_HELTEC_V3
  -D MESHPORT_DIO2_RF_SWITCH=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
